<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f3f8;color:#171229;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <div style="background:#ffffff;border:1px solid #d8d3e1;border-radius:16px;padding:32px">
        <p style="margin:0 0 12px;font-size:13px;letter-spacing:.12em;font-weight:700;color:#574a73">APPLYPACK</p>
        <h1 style="margin:0 0 16px;font-size:26px">Your six-digit sign-in code</h1>
        <p style="margin:0 0 24px;line-height:1.6">Enter this one-time code on ApplyPack to continue your intake or open My ApplyPack.</p>
        <p style="margin:0 0 24px;font-size:34px;letter-spacing:.2em;font-weight:800">{{ .Token }}</p>
        <p style="margin:0;line-height:1.6;color:#514a5e">This code expires shortly and can be used only once. If you did not request it, you can ignore this message. For help, email help@applypack.work.</p>
      </div>
    </div>
  </body>
</html>
