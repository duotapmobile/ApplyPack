name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/test-maintenance-runner.test.mjs scripts/test-renderer-runtime.test.mjs
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, firefox, webkit, mobile-webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - name: Corrected-contract database fixtures
        run: npm run test:database
      - name: Checkout concurrency
        run: cat tests/integration/checkout-concurrency.sql | docker exec -i supabase_db_applypack psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: RLS and financial invariants
        run: cat tests/integration/security-financial-invariants.sql | docker exec -i supabase_db_applypack psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Intake and delivery invariants
        run: cat tests/integration/intake-delivery-invariants.sql | docker exec -i supabase_db_applypack psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Preserved-data migration
        run: |
          supabase db reset --local --version 202609020002 --no-seed
          cat tests/integration/historical-preservation-fixture.sql | docker exec -i supabase_db_applypack psql -U postgres -d postgres -v ON_ERROR_STOP=1
          supabase migration up --local
          cat tests/integration/historical-preservation-assertions.sql | docker exec -i supabase_db_applypack psql -U postgres -d postgres -v ON_ERROR_STOP=1

  document-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation fontconfig poppler-utils
      - run: npm ci
      - run: node --test scripts/test-renderer-runtime.test.mjs
      - name: Render actual DOCX files and verify PDF outputs
        env:
          APP_RENDERER_RUNTIME_DISCOVERY: 'true'
          APPLYPACK_RENDER_EVIDENCE_DIR: evidence/ci-document-render
        run: >-
          node --input-type=module -e
          "import {configureRendererRuntime} from './scripts/configure-renderer-runtime.mjs';
          import {spawnSync} from 'node:child_process';
          configureRendererRuntime();
          const result=spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run','--config','vitest.render.config.mts'],{stdio:'inherit',env:process.env});
          process.exit(result.status ?? 1);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-render-evidence
          path: evidence/ci-document-render
          if-no-files-found: warn
